<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
	<circle cx="50" cy="50" r="50" fill="#1B4F9C"/>
	<defs>
		<!-- one petal, pointing up: a curved triangle with its apex towards the rim -->
		<path id="p" d="M50 45 C 42.5 36, 38.5 26, 38 14.5 C 45.5 11, 54.5 11, 62 14.5 C 61.5 26, 57.5 36, 50 45 Z" transform="rotate(-9 50 28)"
			fill="none" stroke="#fff" stroke-width="4.8" stroke-linejoin="round"/>
	</defs>
	<use href="#p"/>
	<use href="#p" transform="rotate(60 50 50)"/>
	<use href="#p" transform="rotate(120 50 50)"/>
	<use href="#p" transform="rotate(180 50 50)"/>
	<use href="#p" transform="rotate(240 50 50)"/>
	<use href="#p" transform="rotate(300 50 50)"/>
</svg>
